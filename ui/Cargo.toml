[package]
name = "gitsearcher-ui"
version = "0.1.3"
edition = "2021"

[[bin]]
name = "gitsearcher-ui"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.28"
egui_extras = { version = "0.28", features = ["all_loaders"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rfd = "0.14"
chrono = { version = "0.4", features = ["serde"] }
open = "5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
